name: security

# Secret scan + Python SAST + dependency audit. Actions pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary; no
  # license needed, unlike gitleaks-action on org repos).
  secrets:
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@fb1a159c596bf2c57b9f6f1ff99f546463a6a84a

  python:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install scanners (pinned, isolated)
        run: |
          pipx install bandit==1.9.4
          pipx install pip-audit==2.10.1
          pipx install uv==0.12.19
      - name: bandit (SAST, medium+ severity)
        run: bandit -r mechubbench -ll
      - name: pip-audit (dependency CVEs, report-only)
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt > "$RUNNER_TEMP/req.txt"
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/req.txt"
