name: secret-scan

# Secret scan over the results/ files this event actually changes, not the
# full tree. results/ holds run transcripts (device tool-call output) and is
# the highest-risk path for a leaked credential landing in git.
#
# Scoped to the diff on purpose: `results/sweep8-junos-ornith-35b.json` (MEC-38)
# was already removed from every branch's working tree, but its blob is still
# reachable in git history, so a full-history `gitleaks detect`/`git` scan
# still finds it. Scanning the working tree of the *diff only* never touches
# that history, so this goes green today without allowlisting the file.
# Once MEC-193 (history purge) lands, widen this to `gitleaks dir results/`
# over the full tree on both push and pull_request (tracked as a fast-follow).
#
# Residual risk: this only catches leaks that reach a push or PR. A results
# file shared outside git (e.g. pasted into chat) is covered only by
# mechubbench/redact.py, which runs before the manifest is written.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-results-diff:
    name: gitleaks + grep backstop (results/ diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine changed results/ files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request|pull_request_target)
              range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
              ;;
            push)
              if [ -z "$PUSH_BEFORE_SHA" ] || [ "$PUSH_BEFORE_SHA" = "$zero_sha" ]; then
                range=""
              else
                range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
            *)
              range=""
              ;;
          esac

          : > changed_results_files.txt
          if [ -n "$range" ]; then
            git diff --name-only --diff-filter=ACMR "$range" -- results/ >> changed_results_files.txt || true
          else
            # New branch push with no "before": scan just the pushed commit.
            git show --name-only --diff-filter=ACMR --format= "$PUSH_AFTER_SHA" -- results/ >> changed_results_files.txt || true
          fi
          sed -i '/^$/d' changed_results_files.txt

          count=$(wc -l < changed_results_files.txt)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Changed results/ files in this event: $count"
          cat changed_results_files.txt

      - name: Stage changed files for scanning
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          rm -rf scan-staging
          mkdir -p scan-staging
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "scan-staging/$(dirname "$f")"
            cp "$f" "scan-staging/$f"
          done < changed_results_files.txt

      - name: Install gitleaks (pinned)
        if: steps.diff.outputs.count != '0'
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks

      - name: gitleaks (results/ diff only)
        if: steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          args=(dir scan-staging --exit-code 1 --redact --no-banner)
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
          fi
          gitleaks "${args[@]}"

      - name: grep backstop (results/ diff only, independent of gitleaks)
        if: always() && steps.diff.outputs.count != '0'
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if grep -Ern '\$[1-9y]\$|encrypted-password|BEGIN .*PRIVATE KEY|ssh-(ed25519|rsa) AAAA' "$f"; then
              echo "::error file=${f}::secret-shaped string matched grep backstop"
              fail=1
            fi
          done < changed_results_files.txt
          exit "$fail"
