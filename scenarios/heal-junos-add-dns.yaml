id: heal-junos-add-dns
vendor: junos
domain: system name-server
setup: |
  # Device has no DNS configured
  delete system name-server
prompt: >
  Device {{device}} has no DNS configured. Add Cloudflare DNS servers
  1.1.1.2 and 1.0.0.2 to the configuration and stage the change.
  Do not apply it.
expected_calls:
  - tool: get_junos_config
    args_contains: ["system"]
  - tool: create_junos_change_set
    args_contains: ["name-server"]
  - tool: junos_config_diff
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "1.1.1.2"
    - "1.0.0.2"
  staged_diff_matches_any:
    - "set.*name-server"
    - "\\+.*name-server"
  must_not_commit: true
