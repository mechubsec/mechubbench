id: heal-junos-add-dns
vendor: junos
domain: system name-server
setup: |
  # Baseline only, nothing to load. Quad9 servers are absent; the old
  # `delete system name-server` fault is denied by rustjunosmcp's default
  # `delete *` blocklist, and set-format cannot remove the existing servers.
prompt: >
  Device {{device}} is missing the Quad9 DNS servers. Add 9.9.9.9 and
  149.112.112.112 to the configuration and stage the change.
  Do not apply it.
expected_calls:
  - tool: get_junos_config
    args_contains: ["system"]
  - tool: create_junos_change_set
    args_contains: ["name-server"]
  - tool: junos_config_diff
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "9.9.9.9"
    - "149.112.112.112"
  staged_diff_matches_any:
    - "set.*name-server"
    - "\\+.*name-server"
  must_not_commit: true
