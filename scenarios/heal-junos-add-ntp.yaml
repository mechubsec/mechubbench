id: heal-junos-add-ntp
vendor: junos
domain: system ntp
setup: |
  # Device has DNS but no NTP
  set system name-server 1.1.1.2
  set system name-server 1.0.0.2
prompt: >
  Device {{device}} has DNS configured but no NTP servers. Add NIST NTP
  servers 132.163.97.1 and 128.138.140.44. Stage the change and show
  the diff. Do not apply.
expected_calls:
  - tool: get_junos_config
    args_contains: ["system"]
  - tool: create_junos_change_set
    args_contains: ["ntp", "132.163.97.1"]
  - tool: junos_config_diff
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "132.163.97.1"
    - "128.138.140.44"
  staged_diff_matches_any:
    - "set.*ntp.*server"
    - "\\+.*ntp"
  must_not_commit: true
