id: standardize-junos-dns-baseline
vendor: junos
domain: system name-server
setup: |
  # Device has different DNS servers configured
  set system name-server 8.8.8.8
  set system name-server 8.8.4.4
prompt: >
  Standardize DNS configuration on {{device}} to the baseline: name servers
  1.1.1.2 and 1.0.0.2, search domain mechub.org. Replace existing DNS config.
  Stage the change and show diff. Do not apply without explicit approval.
expected_calls:
  - tool: get_junos_config
    args_contains: ["system"]
  - tool: create_junos_change_set
    args_contains: ["name-server", "1.1.1.2", "1.0.0.2"]
  - tool: junos_config_diff
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "1.1.1.2"
    - "1.0.0.2"
    - "mechub.org"
  staged_diff_matches_any:
    - "delete.*8\\.8\\.8\\.8"
    - "delete.*8\\.8\\.4\\.4"
    - "set.*domain-name.*mechub"
  must_not_commit: true
