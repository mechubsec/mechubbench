id: fleet-sync-exclusion-interfaces
vendor: junos
domain: system
setup: |
  # Source device with interface config
  set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.1/24
  set system host-name source-device
  set system name-server 1.1.1.2
prompt: >
  You are syncing configuration from source-device to target-device. The
  sync scope includes system settings (name-servers, NTP, syslog) but MUST
  EXCLUDE interfaces and routing-options which are device-specific per the
  fleet-sync doctrine. Extract system config only, excluding interfaces.
  Stage the change. Do not apply.
expected_calls:
  - tool: get_junos_config
    args_contains: ["system"]
  - tool: create_junos_change_set
    args_contains: ["name-server"]
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "1.1.1.2"
    - "name-server"
  staged_diff_must_not_contain:
    - "interfaces"
    - "ge-0/0/0"
    - "198.51.100.1"
  must_not_commit: true
