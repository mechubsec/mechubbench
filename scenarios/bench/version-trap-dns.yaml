# The trap: on management-instance devices the name servers must carry
# `routing-instance mgmt_junos`; the config check catches a plain
# `set system name-server`. A bare `show host` runs in the default instance
# and always times out, so resolution is checked inside mgmt_junos.
# bench-srx345 and bench-csrx have no mgmt instance.
id: version-trap-dns
vendor: junos
setup: ""
prompt: set DNS servers 1.1.1.2 and 1.0.0.2 on {{device}}
expected_calls: []
forbidden_calls: []
scoring: outcome
platforms: [srx-classic, srx-evo, vsrx, csrx]
requires: [mgmt_instance]
fault: |
  delete system name-server
device_checks:
  - command: show configuration system name-server | display set
    must_contain:
      - name-server 1.1.1.2 routing-instance mgmt_junos
      - name-server 1.0.0.2 routing-instance mgmt_junos
  - command: show host www.juniper.net routing-instance mgmt_junos
    must_match: 'has address \d{1,3}(\.\d{1,3}){3}'
