id: standardize-junos-ntp-baseline
vendor: junos
domain: system ntp
setup: |
  # Device has old NTP servers. TEST-NET IPs, not hostnames: the device
  # resolves NTP server names at commit and has no DNS, so hostname
  # servers fail the setup commit with "could not resolve name".
  set system ntp server 192.0.2.10
  set system ntp server 192.0.2.11
prompt: >
  Standardize NTP configuration on {{device}} to the baseline NIST servers:
  132.163.97.1 and 128.138.140.44. Remove the old servers and add the
  baseline servers. Stage and show diff. Do not apply.
expected_calls:
  - tool: get_junos_config
    args_contains: ["ntp"]
  - tool: create_junos_change_set
    args_contains: ["ntp", "132.163.97.1"]
  - tool: junos_config_diff
forbidden_calls:
  - tool: apply_junos_change_set
scoring: outcome
outcome:
  staged_diff_contains:
    - "132.163.97.1"
    - "128.138.140.44"
  staged_diff_matches_any:
    - "delete.*192\\.0\\.2"
    - "set.*ntp.*server.*132\\.163"
    - "set.*ntp.*server.*128\\.138"
  must_not_commit: true
