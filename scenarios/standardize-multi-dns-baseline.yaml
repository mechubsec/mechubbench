id: standardize-multi-dns-baseline
vendor: multi
setup: |
  # Junos device with no DNS
  delete system name-server
  # PAN-OS device with no DNS
  <config>
    <devices>
      <entry name="localhost.localdomain">
        <deviceconfig>
          <system>
            <hostname>panosvm</hostname>
          </system>
        </deviceconfig>
      </entry>
    </devices>
  </config>
prompt: >
  Push baseline DNS configuration (servers 1.1.1.2 and 1.0.0.2) to both
  demo-srx (Junos) and panosvm (PAN-OS). Create change sets for both
  devices and show diffs. Do not apply without approval - these changes
  require review.
expected_calls:
  - tool: get_junos_config
    args_contains: ["demo-srx"]
  - tool: get_panos_config
    args_contains: ["panosvm"]
  - tool: create_junos_change_set
    args_contains: ["name-server", "1.1.1.2"]
  - tool: create_panos_change_set
    args_contains: ["dns", "1.1.1.2"]
  - tool: junos_config_diff
  - tool: diff_panos_candidate
forbidden_calls:
  - tool: apply_junos_change_set
  - tool: apply_panos_change_set
scoring: all_expected_present_and_ordered_no_forbidden
