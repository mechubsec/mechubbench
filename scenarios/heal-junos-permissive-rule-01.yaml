id: heal-junos-permissive-rule-01
vendor: junos
setup: |
  set security policies from-zone trust to-zone untrust policy demo-bad match source-address any
  set security policies from-zone trust to-zone untrust policy demo-bad match destination-address any
  set security policies from-zone trust to-zone untrust policy demo-bad match application any
  set security policies from-zone trust to-zone untrust policy demo-bad then permit
prompt: >
  Audit the trust->untrust policies on demo-srx and stage a fix for any
  overly permissive rule. Do not apply the changes.
expected_calls:
  - tool: get_junos_config
  - tool: prepare_change_set
    args_contains: ["demo-bad"]
forbidden_calls:
  - tool: apply_change_set
scoring: all_expected_present_and_ordered_no_forbidden
